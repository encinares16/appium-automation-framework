name: Android Emulator Tests

on:
  push:
    branches:
      - ci/setup-slack-alerts

env:
  DOTENV_CONFIG_QUIET: true
  STANDARD_USER: ${{ secrets.STANDARD_USER }}
  STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
  LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
  LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: TypeScript type check
        run: npx tsc --project tsconfig.json --noEmit

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android Emulator and Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
          script: |
            adb wait-for-device
            adb devices
            adb shell getprop ro.build.version.release

            echo "Installing APK..."
            adb install -r ./app/app.apk

            echo "Running WDIO tests..."
            npm run wdio:spec

      - name: Extract Allure summary
        if: always()
        id: allure
        run: |
          sudo apt-get update && sudo apt-get install -y jq

          PASSED=$(find allure-results -name "*.json" -exec jq '.status' {} \; | grep -c "passed" || true)
          FAILED=$(find allure-results -name "*.json" -exec jq '.status' {} \; | grep -c "failed" || true)
          BROKEN=$(find allure-results -name "*.json" -exec jq '.status' {} \; | grep -c "broken" || true)

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "broken=$BROKEN" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout gh-pages
        run: |
          git fetch origin gh-pages || true

          if git ls-remote --heads origin gh-pages | grep gh-pages; then
            git worktree add gh-pages origin/gh-pages
          else
            mkdir -p gh-pages
          fi

      - name: Upload Allure Results
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            cp -r allure-results gh-pages/allure-results
            echo "Copying Allure results succesfuly..."
          fi

      - name: Restore Allure History
        if: always()
        run: |
          ls 

          if [ -f "gh-pages/allure-history/history.jsonl" ]; then
            cp gh-pages/allure-history/history.jsonl allure-results/history.jsonl

            echo "History restored."
          else
            echo "No previous history found."
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          npx allure generate allure-results -o allure-report
          echo "Generating report done..."

      - name: Prepare GitHub Pages
        if: always()
        run: |
          mkdir -p gh-pages

          if [ -d allure-report ]; then
            cp -rf allure-report gh-pages/allure-report
          fi

          mkdir -p gh-pages/allure-history

          if [ -f allure-history/history.jsonl ]; then
            cp allure-history/history.jsonl gh-pages/allure-history/
          fi

      - name: Deploy Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages
          keep_files: true

      - name: Set Short SHA
        if: always()
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#FF0000",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🚀 CI Mobile Test Automation Build Failed"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repo Name:*\n:git-branch: <https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}|${{ github.event.repository.name }}>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Build Run:*\n#${{ github.run_number }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Commit:*\n:commit: <https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/commit/${{ github.sha }}|${{ steps.vars.outputs.sha_short }}> :delete:"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Author:*\n:github: ${{ github.actor }}"
                        }
                      ]
                    },
                  ]
                }
              ]
              }

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#2EB67D",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🚀 CI Mobile Test Automation Build Succeeded"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repo Name:*\n:git-branch: <https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}|${{ github.event.repository.name }}>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Build Run:*\n#${{ github.run_number }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Commit:*\n:commit: <https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/commit/${{ github.sha }}|${{ steps.vars.outputs.sha_short }}> :check:"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Author:*\n:github: ${{ github.actor }}"
                        }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Results*\n• *Passed:* ${{ steps.allure.outputs.passed }}\n• *Failed:* ${{ steps.allure.outputs.failed }}\n• *Broken:* ${{ steps.allure.outputs.broken }}"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": ":allure-logo: Allure Report"
                          },
                          "url": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/",
                          "style": "primary"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
