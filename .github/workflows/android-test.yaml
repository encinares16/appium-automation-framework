name: Android Emulator Tests

on:
  push:
    branches: [main, develop, ci/fix-allure-report-history]

env:
  DOTENV_CONFIG_QUIET: true
  STANDARD_USER: ${{ secrets.STANDARD_USER }}
  STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
  LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
  LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}
  ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: TypeScript type check
        run: npx tsc --project tsconfig.json --noEmit

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android Emulator and Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-snapshot
            -camera-front none
            -camera-back none
            -no-metrics
          script: |
            adb wait-for-device
            adb devices
            adb shell getprop ro.build.version.release

            echo "Installing APK..."
            adb install -r ./app/app.apk

            echo "Running WDIO tests..."
            npm run wdio:spec

      - name: Extract Allure summary
        if: always()
        id: allure
        run: |
          sudo apt-get update && sudo apt-get install -y jq

          PASSED=$(find allure-results -name "*.json" -exec jq '.status' {} \; | grep -c "passed" || true)
          FAILED=$(find allure-results -name "*.json" -exec jq '.status' {} \; | grep -c "failed" || true)
          BROKEN=$(find allure-results -name "*.json" -exec jq '.status' {} \; | grep -c "broken" || true)

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "broken=$BROKEN" >> $GITHUB_OUTPUT

      - name: Prepare Temporary GitHub Pages
        if: always()
        run: mkdir -p ./temp-gh-pages

      - name: Checkout gh-pages Branch
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # ALLURE 3 RESTORE: Move the last run's history file directly into your new results
      - name: Restore Allure 3 History
        if: always()
        run: |
          mkdir -p allure-results
          if [ -f "gh-pages/allure-results/history.jsonl" ]; then
            echo "Found previous Allure 3 history.jsonl file."
            cp gh-pages/allure-results/history.jsonl allure-results/
          elif [ -f "gh-pages/allure-history/history.jsonl" ]; then
            echo "Found history in old fallback location."
            cp gh-pages/allure-history/history.jsonl allure-results/
          else
            echo "No previous history file found. This might be the first run."
          fi

      # ALLURE 3 GENERATE: Reads raw results + your restored history.jsonl,
      # and updates history.jsonl automatically inside allure-results.
      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      # ALLURE 3 PREPARE DEPLOY: Copy everything cleanly to the deployment directory
      # No manual file appending needed! Allure 3 already handled it.
      - name: Copy Files to temp-gh-pages
        if: always()
        run: |
          echo "Copying updated results and history..."
          cp -R allure-results ./temp-gh-pages/

          echo "Copying generated HTML report..."
          cp -R allure-report ./temp-gh-pages/

      - name: List Files in temp-gh-pages
        if: always()
        run: ls -R ./temp-gh-pages

      # DEPLOY: This pushes your new report, history.jsonl, and results back to gh-pages
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./temp-gh-pages
          keep_files: false # Set to false so old HTML files don't pollute, your

      - name: Set Short SHA
        if: always()
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#FF0000",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🚀 CI Mobile Test Automation Build Failed"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repo Name:*\n:git-branch-white: <https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}|${{ github.event.repository.name }}>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Build Run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Commit:*\n:git-commit: <https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/commit/${{ github.sha }}|${{ steps.vars.outputs.sha_short }}> :delete:"
                        },
                        {
                          "type": "mrkdwn",
                           "text": "*Commit by:*\n:github-white: ${{ github.event.head_commit.author.name }}"
                        }
                      ]
                    },
                  ]
                }
              ]
              }

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#2EB67D",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🚀 CI Mobile Test Automation Build Succeeded"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repo Name:*\n:git-branch-white: <https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}|${{ github.event.repository.name }}>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Build Run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Commit:*\n:git-commit: <https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/commit/${{ github.sha }}|${{ steps.vars.outputs.sha_short }}> :check:"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Commit by:*\n:github-white: ${{ github.event.head_commit.author.name }}"
                        }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Results*\n• *Passed:* ${{ steps.allure.outputs.passed }}\n• *Failed:* ${{ steps.allure.outputs.failed }}\n• *Broken:* ${{ steps.allure.outputs.broken }}"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": ":allure-logo: View Allure Report"
                          },
                          "url": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-report/",
                          "style": "primary"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
