name: Android Emulator Tests

on:
  push:
    branches:
      - ci/setup-slack-alerts

env:
  DOTENV_CONFIG_QUIET: true
  STANDARD_USER: ${{ secrets.STANDARD_USER }}
  STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
  LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
  LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: TypeScript type check
        run: npx tsc --project tsconfig.json --noEmit

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64"

      - name: Create Android Emulator
        run: |
          echo "no" | avdmanager create avd \
            -n test \
            -k "system-images;android-34;google_apis;x86_64"

      - name: Start Android Emulator
        run: |
          $ANDROID_HOME/emulator/emulator \
            -avd test \
            -no-window \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            &

      - name: Wait For Device
        run: |
          adb wait-for-device

      - name: Wait For Android Boot
        timeout-minutes: 10
        run: |
          until adb shell getprop sys.boot_completed | grep -m 1 "1"; do
            echo "Waiting for emulator boot..."
            sleep 5
          done

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: ADB Devices
        run: |
          adb devices

      - name: Check Android Version
        run: |
          adb shell getprop ro.build.version.release

      - name: Install APK
        run: |
          echo "Installing APK..."
          adb install -r ./app/app.apk

      - name: Run WDIO Tests
        run: |
          echo "Running Tests..."
          npm run wdio:spec

      - name: Extract Allure Summary
        if: always()
        id: allure
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          PASSED=$(find allure-results -name "*.json" -exec jq '.status' {} \; | grep -c "passed" || true)
          FAILED=$(find allure-results -name "*.json" -exec jq '.status' {} \; | grep -c "failed" || true)
          BROKEN=$(find allure-results -name "*.json" -exec jq '.status' {} \; | grep -c "broken" || true)

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "broken=$BROKEN" >> $GITHUB_OUTPUT

      - name: Upload Allure Results
        if: always()
        run: |
          mkdir -p gh-pages

          if [ -d "allure-results" ]; then
            cp -r allure-results gh-pages/allure-results
          fi

      - name: Restore Allure History
        if: always()
        run: |
          if [ -f "gh-pages/allure-history/history.jsonl" ]; then
            mkdir -p allure-results
            cp gh-pages/allure-history/history.jsonl allure-results/history.jsonl
            echo "History restored."
          else
            echo "No previous history found."
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          npm run allure:generate

      - name: Prepare GitHub Pages
        if: always()
        run: |
          mkdir -p gh-pages

          if [ -d allure-report ]; then
            cp -rf allure-report gh-pages/allure-report
          fi

          mkdir -p gh-pages/allure-history

          if [ -f allure-history/history.jsonl ]; then
            cp allure-history/history.jsonl gh-pages/allure-history/
          fi

      - name: Deploy Report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages
          keep_files: true

      - name: Set Short SHA
        if: always()
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Stop Android Emulator
        if: always()
        run: |
          adb emu kill || true

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [{
                "color": "#FF0000",
                "blocks": [{
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 CI Mobile Test Automation Build Failed"
                  }
                }]
              }]
            }

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [{
                "color": "#2EB67D",
                "blocks": [{
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 CI Mobile Test Automation Build Succeeded"
                  }
                }]
              }]
            }